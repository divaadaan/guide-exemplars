[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "guide-exemplars"
version = "0.1.0"
description = "Boundary-focused in-context exemplar optimization (GUIDE) for LLM-based ordinal grading, as a library and microservice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Daniel Sachs" }]
keywords = ["llm", "in-context-learning", "few-shot", "automated-grading", "bayesian-optimization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core library dependencies only. `guide_exemplars.core` must stay importable with just these.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["openai>=1.40", "tiktoken>=0.7", "python-dotenv>=1.0"]
litellm = ["litellm>=1.40"]  # optional adapter for non-OpenAI-compatible providers
local-embed = ["sentence-transformers>=2.7"]
data = ["pandas>=2.1"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]  # storage is stdlib sqlite3
umap = ["umap-learn>=0.5"]
bench = ["pandas>=2.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]
all = ["guide-exemplars[llm,local-embed,data,service,umap,bench]"]

[project.scripts]
guide = "guide_exemplars.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/guide_exemplars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode math symbols in docstrings/comments

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # formatter wraps code at 110; allow prose in docstrings/comments a little slack

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
