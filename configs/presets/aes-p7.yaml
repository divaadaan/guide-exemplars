    task: tasks/asap-aes-p7-conventions.yaml
    source:
      kind: asap_aes
      file: asap-aes/training_set_rel3.tsv
      essay_set: 7
      trait: 4
      label_policy: min_drop_gap2
split:
  ratios: [3, 1, 1]
  seed: 0
  experts_per_label: 1
