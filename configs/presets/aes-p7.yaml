name: aes-p7
description: >-
  ASAP-AES essay set 7 (grade 7 narrative on patience), Conventions trait (0-3). Rater scores are combined with
  min_drop_gap2: drop items whose raters differ by 2 or more, otherwise take the lower score.
tasks:
