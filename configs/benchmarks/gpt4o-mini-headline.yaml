# The single paid run: paper-parity backbone on ASAP-AES prompt 7 (full split), GUIDE vs the four baselines.
# Check the cost first with `guide benchmark gpt4o-mini-headline --dry-run`.
name: gpt4o-mini-headline
description: GUIDE vs Naive / Random / KNN-SBERT / Vote-k on aes-p7 with gpt-4o-mini (seed 0).
backbone: gpt4o-mini
knn_embedder: st/all-MiniLM-L6-v2
preset: aes-p7
seeds: [0]
methods: [guide, naive, random, knn, vote_k]
random_draws: 5
ablations: {}
guide: {}
bootstrap: { B: 2000, ci: 0.95, seed: 0 }
max_cost_usd: 35  # balance ~$36.70 on 2026-11-25 after the first attempt (~$3.23, cached); stay under it
